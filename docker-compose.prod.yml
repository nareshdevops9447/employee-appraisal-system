###############################################################################
# docker-compose.prod.yml — Hardened production overlay for Azure VM
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
###############################################################################

services:
  # ============================================
  # PostgreSQL — hardened, no external exposure
  # ============================================
  postgres:
    ports: !override []                    # NEVER expose DB to host
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: >
      postgres
        -c shared_buffers=128MB
        -c effective_cache_size=256MB
        -c work_mem=2MB
        -c maintenance_work_mem=32MB
        -c max_connections=50
        -c log_min_duration_statement=500
        -c log_statement=ddl
        -c log_connections=on
        -c log_disconnections=on
        -c log_hostname=off
        -c password_encryption=scram-sha-256
        -c ssl=off
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./logs/postgres:/var/log/postgresql
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64M
      - /run:size=64M

  # ============================================
  # Backend — hardened, read-only where possible
  # ============================================
  backend:
    ports: !override []                    # Only via Nginx
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/eas_db
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - FLASK_ENV=production
      - PORT=5000
    volumes:
      - ./logs/backend:/app/logs
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /app/__pycache__:size=32M

  # ============================================
  # Frontend — production build, hardened
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        - NEXT_PUBLIC_API_URL=https://${DOMAIN_NAME}
        - NEXT_PUBLIC_BASE_URL=https://${DOMAIN_NAME}
        - NEXT_PUBLIC_AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
    ports: !override []                    # Only via Nginx
    environment:
      - NEXT_PUBLIC_API_URL=https://${DOMAIN_NAME}
      - NEXT_PUBLIC_BASE_URL=https://${DOMAIN_NAME}
      - NEXT_PUBLIC_AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
      - AUTH_SERVICE_URL=http://backend:5000/api
      - NEXTAUTH_URL=https://${DOMAIN_NAME}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AZURE_AD_CLIENT_ID=${AZURE_AD_CLIENT_ID}
      - AZURE_AD_CLIENT_SECRET=${AZURE_AD_CLIENT_SECRET}
      - AZURE_AD_TENANT_ID=${AZURE_AD_TENANT_ID}
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64M
      - /app/.next/cache:size=128M

  # ============================================
  # Nginx — reverse proxy + SSL + WAF-lite
  # ============================================
  nginx:
    image: nginx:1.27-alpine
    container_name: eas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/ssl:/etc/nginx/ssl:ro
      - ./deploy/nginx/certbot:/var/www/certbot:ro
      - ./deploy/nginx/block-ips.conf:/etc/nginx/block-ips.conf:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - appraisal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=32M
      - /var/cache/nginx:size=64M
      - /run:size=16M
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ============================================
  # Certbot — auto-renew SSL (Let's Encrypt)
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: eas-certbot
    volumes:
      - ./deploy/nginx/ssl:/etc/letsencrypt
      - ./deploy/nginx/certbot:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    depends_on:
      - nginx
    networks:
      - appraisal-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
    security_opt:
      - no-new-privileges:true
