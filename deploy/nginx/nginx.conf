user nginx;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 512;                 # Tuned for small VM
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------- Logging ----------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time ua="$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # ---------- Performance (tuned for B1ms/2GB) ----------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 30;
    types_hash_max_size 2048;
    client_max_body_size 5M;               # Tighter upload limit
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    reset_timedout_connection on;

    # Limit buffer sizes to prevent large-header attacks
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # ---------- Gzip ----------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # ---------- Security ----------
    server_tokens off;                     # Hide Nginx version
    more_set_headers 'Server: ';           # Remove Server header entirely (if headers-more module)

    # ---------- Rate Limiting ----------
    limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=connlimit:10m;

    # ---------- IP Blocklist (managed externally) ----------
    include /etc/nginx/block-ips.conf;

    # ---------- Map for blocking bad user agents ----------
    map $http_user_agent $bad_bot {
        default 0;
        ~*(?:sqlmap|nikto|nmap|masscan|ZmEu|dirbuster|gobuster|wpscan) 1;
        ~*(?:python-requests|python-urllib|Go-http-client|curl/|wget/) 0;
        "" 1;                              # Block empty user agents
    }

    # ---------- Upstream Backends ----------
    upstream frontend {
        server eas-frontend:3000;
        keepalive 8;
    }

    upstream backend {
        server eas-backend:5000;
        keepalive 8;
    }

    # ---------- Block direct IP access (no valid Host) ----------
    server {
        listen 80 default_server;
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Return 444 (close connection, no response)
        return 444;
    }

    # ---------- HTTP → HTTPS Redirect ----------
    server {
        listen 80;
        server_name ${DOMAIN_NAME};

        # Let's Encrypt ACME challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ---------- HTTPS Server ----------
    server {
        listen 443 ssl;
        http2 on;
        server_name ${DOMAIN_NAME};

        # ---------- SSL Certificates ----------
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # ---------- SSL Hardening (Mozilla Intermediate) ----------
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # OCSP Stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 168.63.129.16 valid=300s;     # Azure DNS
        resolver_timeout 5s;

        # ---------- Security Headers ----------
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://login.microsoftonline.com https://graph.microsoft.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://login.microsoftonline.com;" always;

        # ---------- Connection Limits ----------
        limit_conn connlimit 20;

        # ---------- Block bad bots ----------
        if ($bad_bot) {
            return 403;
        }

        # ---------- Block common vulnerability scanners ----------
        location ~* ^/(wp-admin|wp-login|xmlrpc|\.env|\.git|phpmyadmin|admin\.php|shell|cgi-bin) {
            access_log off;
            return 444;
        }

        # ---------- API Backend ----------
        location /api/ {
            limit_req zone=api burst=15 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts
            proxy_connect_timeout 15s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;

            # Buffer limits
            proxy_buffer_size 8k;
            proxy_buffers 4 16k;
        }

        # Stricter rate limit for auth endpoints
        location /api/auth/ {
            limit_req zone=login burst=2 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        # ---------- Health Check (no rate limit, no logging) ----------
        location /health {
            proxy_pass http://backend/health;
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;                      # Only internal/localhost
        }

        # ---------- Frontend (Next.js) ----------
        location / {
            limit_req zone=general burst=30 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ---------- Static Assets (aggressive caching) ----------
        location /_next/static/ {
            proxy_pass http://frontend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        location /favicon.ico {
            proxy_pass http://frontend;
            access_log off;
            expires 30d;
        }

        # ---------- Block dot-files and sensitive paths ----------
        location ~ /\. {
            deny all;
            return 404;
        }

        # Block common backup/config file extensions
        location ~* \.(sql|bak|old|orig|save|swp|dist|config)$ {
            deny all;
            return 404;
        }
    }
}
